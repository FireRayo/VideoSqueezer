<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A local video editor. Trim, split, join, change audio, and reduce video size in one offline HTML file.">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src blob: data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>VideoSquiser</title>
<style>
/* Unión completa: el orden se elige por identidad y los ajustes son explícitos. */
.join-panel{padding:16px;margin-top:16px;border-radius:14px;box-shadow:var(--inset)}
.join-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}
.join-heading h3{font-size:14px;margin:0}
.join-order{list-style:none;padding:0;margin:14px 0;display:grid;gap:12px}
.join-order li{display:grid;grid-template-columns:100px minmax(0,1fr);gap:10px;align-items:center}
.join-order label{font-size:12px;font-weight:650}
.join-order select{width:100%;min-width:0;text-overflow:ellipsis}
.join-options{display:flex;align-items:flex-start;gap:9px;font-size:12px;line-height:1.5;margin-top:14px}
.join-options input{margin-top:3px;accent-color:var(--accent)}
@media(max-width:480px){.join-order li{grid-template-columns:1fr;gap:6px}.join-heading{align-items:flex-start}}

.copy-cuts{
  box-shadow:var(--inset);
  border-radius:12px;
  padding:12px;
  margin:0 0 14px;
  max-height:195px;
  overflow:auto
}
.copy-cut-row{
  font-size:11px;
  color:var(--text-muted);
  overflow-wrap:anywhere
}
.copy-cut-row+.copy-cut-row{
  margin-top:8px
}
/* Paleta contractual exacta. Los colores semánticos solo señalan estados. */
:root{
  color-scheme:light;
  --bg:#DFE4EA;
  --surface:#E5E9EE;
  --shadow-light:#FFFFFF;
  --shadow-dark:#C2C6CA;
  --text:#30363B;
  --text-muted:#687078;
  --accent-light:#6C9EFF;
  --accent:#557BD9;
  --accent-dark:#526FC0;
  --error:#983D3D;
  --success:#346C58;
  --warning:#845819;
  --radius:22px;
  --small-radius:12px;
  --gap:22px;
  --transition:160ms ease;
  --raised:8px 8px 18px var(--shadow-dark),-8px -8px 18px var(--shadow-light);
  --raised-small:4px 4px 9px var(--shadow-dark),-4px -4px 9px var(--shadow-light);
  --inset:inset 4px 4px 9px var(--shadow-dark),inset -4px -4px 9px var(--shadow-light)
}
html[data-theme=dark]{
  color-scheme:dark;
  --bg:#20252B;
  --surface:#272C33;
  --shadow-light:#323841;
  --shadow-dark:#181C21;
  --text:#E6EAF0;
  --text-muted:#9CA6B2;
  --accent-light:#739DF2;
  --accent:#5C7FD6;
  --accent-dark:#4868B8;
  --error:#F0ADAD;
  --success:#93C9B6;
  --warning:#E2BC7E
}
*{
  box-sizing:border-box
}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  transition:background var(--transition),color var(--transition)
}
button,input,select{
  font:inherit;
  color:inherit
}
button,a,input,select,summary{
  -webkit-tap-highlight-color:transparent
}
button{
  border:0;
  cursor:pointer
}
button:disabled{
  opacity:.42;
  cursor:not-allowed
}
button:not(:disabled):active{
  box-shadow:var(--inset)
}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:4px
}
input,select{
  max-width:100%
}
button,a{
  touch-action:manipulation
}
a{
  color:var(--accent-dark);
  text-underline-offset:3px
}
html[data-theme=dark] a{
  color:var(--accent-light)
}
h1,h2,h3,p{
  margin:0
}
h1{
  font-size:clamp(25px,3vw,34px);
  font-weight:650;
  letter-spacing:-1px;
  line-height:1.25
}
h2{
  font-size:16px;
  font-weight:650;
  letter-spacing:-.25px
}
h3{
  font-size:14px
}
small,.muted{
  color:var(--text-muted)
}
svg{
  width:20px;
  height:20px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
  flex-shrink:0
}
button svg{
  pointer-events:none
}
.shell{
  max-width:1480px;
  margin:auto;
  padding:28px 32px 22px
}
.topbar,.row,.section-head,.field-line{
  display:flex;
  align-items:center;
  gap:12px
}
.topbar{
  justify-content:space-between;
  margin-bottom:30px
}
.brand{
  display:flex;
  align-items:center;
  gap:14px
}
.brand-mark{
  width:50px;
  height:50px;
  display:grid;
  place-items:center;
  border-radius:17px;
  box-shadow:var(--raised-small);
  background:var(--surface);
  color:var(--accent-dark)
}
.brand-mark svg{
  width:27px;
  height:27px
}
.brand-name{
  font-size:21px;
  font-weight:700;
  letter-spacing:-.65px
}
.brand-sub{
  font-size:10px;
  letter-spacing:1.7px;
  text-transform:uppercase;
  color:var(--text-muted);
  margin-top:1px
}
.top-controls{
  display:flex;
  align-items:center;
  gap:12px
}
.button,.icon-button{
  background:var(--surface);
  box-shadow:var(--raised-small);
  border-radius:var(--small-radius);
  min-height:42px;
  padding:10px 16px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:box-shadow var(--transition),color var(--transition)
}
.button:hover:not(:disabled),.icon-button:hover:not(:disabled){
  color:var(--accent-dark)
}
.icon-button{
  width:42px;
  padding:10px
}
.button.primary{
  color:#fff;
  background:linear-gradient(145deg,var(--accent-light),var(--accent-dark));
  font-weight:650
}
.button.primary:hover:not(:disabled){
  color:#fff;
  filter:brightness(1.03)
}
.button.small{
  font-size:12px;
  min-height:34px;
  padding:7px 11px;
  border-radius:10px
}
.button.quiet{
  box-shadow:none;
  background:transparent;
  color:var(--text-muted)
}
.select,input[type=text],input[type=number]{
  border:0;
  border-radius:11px;
  background:var(--surface);
  box-shadow:var(--inset);
  padding:11px 13px;
  min-height:42px;
  outline-offset:3px
}
.select{
  padding-right:30px
}
#languageSelect{
  width:142px
}
.intro{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  margin-bottom:24px
}
.intro p{
  color:var(--text-muted);
  margin-top:8px;
  max-width:700px
}
.local-badge{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--text-muted);
  font-size:12px;
  white-space:nowrap
}
.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--success)
}
.grid{
  display:grid;
  grid-template-columns:260px minmax(350px,1fr) 300px;
  gap:var(--gap);
  align-items:start
}
.panel{
  background:var(--surface);
  box-shadow:var(--raised);
  border-radius:var(--radius);
  padding:22px
}
.section-head{
  justify-content:space-between;
  margin-bottom:18px
}
.step{
  display:inline-grid;
  place-items:center;
  width:25px;
  height:25px;
  background:var(--surface);
  box-shadow:var(--inset);
  color:var(--accent-dark);
  border-radius:9px;
  font-size:11px;
  font-weight:700;
  margin-right:8px
}
.count{
  font-size:12px;
  color:var(--text-muted)
}
.dropzone{
  box-shadow:var(--inset);
  border-radius:16px;
  padding:24px 12px;
  text-align:center;
  transition:outline var(--transition)
}
.dropzone.drag{
  outline:2px solid var(--accent)
}
.drop-icon{
  margin:0 auto 10px;
  width:46px;
  height:46px;
  border-radius:15px;
  box-shadow:var(--raised-small);
  display:grid;
  place-items:center;
  color:var(--accent-dark)
}
.dropzone p{
  font-size:12px;
  margin:12px 0 6px;
  color:var(--text-muted)
}
.dropzone small{
  font-size:10px
}
.clip-list{
  display:flex;
  flex-direction:column;
  gap:14px;
  margin-top:20px;
  max-height:460px;
  overflow:auto;
  padding:5px
}
.empty-list{
  text-align:center;
  font-size:12px;
  color:var(--text-muted);
  padding:22px 6px
}
.clip-card{
  padding:10px;
  border-radius:14px;
  box-shadow:var(--raised-small);
  border:1px solid transparent
}
.clip-card.selected{
  box-shadow:var(--inset);
  border-color:var(--accent)
}
.clip-select{
  display:flex;
  align-items:center;
  gap:9px;
  width:100%;
  text-align:left;
  background:transparent;
  padding:0;
  min-width:0
}
.clip-thumb{
  width:54px;
  height:38px;
  object-fit:cover;
  border-radius:8px;
  background:var(--bg);
  flex-shrink:0
}
.clip-info{
  min-width:0
}
.clip-name{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:12px;
  font-weight:650;
  max-width:135px
}
.clip-meta{
  font-size:10px;
  color:var(--text-muted);
  display:block;
  margin-top:3px
}
.clip-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:9px;
  gap:4px
}
.clip-actions button{
  min-height:28px;
  min-width:29px;
  border-radius:8px;
  background:var(--surface);
  box-shadow:var(--raised-small);
  font-size:12px;
  padding:4px 6px
}
.clip-actions .remove{
  margin-left:auto;
  color:var(--text-muted)
}
.library-note{
  font-size:11px;
  color:var(--text-muted);
  margin-top:18px
}
.library-note b{
  font-weight:600
}
.edit-panel{
  padding-bottom:20px
}
.mode-switch{
  display:flex;
  padding:5px;
  border-radius:14px;
  box-shadow:var(--inset);
  gap:6px
}
.mode-switch button{
  flex:1;
  background:transparent;
  color:var(--text-muted);
  padding:9px 12px;
  border-radius:10px;
  font-size:13px;
  white-space:nowrap
}
.mode-switch button[aria-selected=true]{
  background:var(--surface);
  color:var(--accent-dark);
  box-shadow:var(--raised-small);
  font-weight:650
}
.video-stage{
  position:relative;
  margin-top:18px;
  aspect-ratio:16/9;
  box-shadow:var(--inset);
  border-radius:16px;
  overflow:hidden;
  display:grid;
  place-items:center;
  background:var(--bg)
}
.video-stage video,.video-stage canvas{
  width:100%;
  height:100%;
  object-fit:contain;
  position:absolute;
  inset:0;
  background:#10151b
}
.video-stage canvas{
  z-index:2;
  pointer-events:none
}
.video-empty{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  color:var(--text-muted);
  gap:12px;
  padding:20px
}
.video-empty svg{
  width:46px;
  height:46px;
  stroke-width:1
}
.video-empty p{
  font-size:13px
}
.video-empty span{
  font-size:11px
}
.source-details{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  color:var(--text-muted);
  font-size:11px;
  padding:12px 2px 15px;
  min-height:43px;
  flex-wrap:wrap
}
.source-details span:first-child{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  max-width:70%
}
.mode-help{
  font-size:12px;
  color:var(--text-muted);
  min-height:38px;
  margin:0 0 13px
}
.timeline{
  box-shadow:var(--inset);
  border-radius:10px;
  height:25px;
  position:relative;
  overflow:hidden;
  margin:12px 0 4px
}
.timeline-selection{
  position:absolute;
  top:6px;
  bottom:6px;
  left:0;
  width:100%;
  border-radius:4px;
  background:var(--accent);
  opacity:.45
}
.timeline-playhead{
  position:absolute;
  top:3px;
  bottom:3px;
  width:2px;
  background:var(--text);
  left:0
}
.timeline-split{
  position:absolute;
  top:3px;
  bottom:3px;
  width:3px;
  background:var(--accent-dark)
}
#seekSlider{
  position:absolute;
  inset:0;
  margin:0;
  width:100%;
  opacity:0;
  cursor:pointer
}
.time-ruler{
  display:flex;
  justify-content:space-between;
  color:var(--text-muted);
  font-size:10px;
  font-variant-numeric:tabular-nums
}
.range-fields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:16px
}
.field label,.field-label{
  display:block;
  font-size:11px;
  font-weight:600;
  margin-bottom:7px;
  color:var(--text-muted)
}
.time-input-row{
  display:flex;
  gap:6px;
  align-items:center
}
.time-input-row input{
  width:100%;
  min-width:0;
  font-variant-numeric:tabular-nums;
  font-size:12px;
  padding:10px
}
.time-input-row button{
  min-width:32px;
  min-height:38px;
  border-radius:10px;
  background:var(--surface);
  box-shadow:var(--raised-small);
  color:var(--accent-dark);
  padding:6px
}
.range-fields .duration{
  grid-column:1/-1;
  font-size:11px;
  color:var(--text-muted);
  margin-top:-3px
}
.split-fields{
  margin-top:15px;
  padding-top:15px;
  border-top:1px solid var(--shadow-dark)
}
.split-line{
  display:flex;
  align-items:center;
  gap:10px
}
.split-line input[type=text]{
  width:132px;
  font-size:12px;
  font-variant-numeric:tabular-nums
}
.split-line input[type=range]{
  min-width:0;
  flex:1
}
input[type=range]{
  accent-color:var(--accent);
  cursor:pointer;
  min-height:26px
}
.preview-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-top:15px
}
.preview-actions .muted{
  font-size:11px
}
.field{
  margin-top:16px
}
.field:first-of-type{
  margin-top:0
}
.field .select{
  width:100%;
  font-size:12px
}
.dual-fields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px
}
.dual-fields .field{
  margin-top:16px
}
.dual-fields.compression-layout{
  grid-template-columns:1fr
}
.bitrate-row{
  display:flex;
  gap:8px;
  align-items:center
}
.bitrate-row input{
  width:100%;
  min-width:0
}
.bitrate-row span{
  font-size:11px;
  color:var(--text-muted)
}
.volume-label{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px
}
.volume-label output{
  color:var(--accent-dark);
  font-weight:650;
  font-size:12px
}
.volume-row{
  display:flex;
  align-items:center;
  gap:10px
}
.volume-row input{
  flex:1;
  min-width:0
}
.volume-row button{
  flex-shrink:0
}
.settings-note{
  font-size:11px;
  color:var(--text-muted);
  margin-top:10px
}
.plan-box{
  box-shadow:var(--inset);
  border-radius:13px;
  padding:13px;
  margin:20px 0 14px;
  font-size:12px
}
.plan-line{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:7px
}
.plan-line:first-child{
  margin-top:0
}
.plan-line>span{
  color:var(--text-muted)
}
.plan-line b{
  font-weight:650;
  text-align:right
}
.plan-detail{
  font-size:10px;
  color:var(--text-muted);
  margin-top:8px;
  overflow-wrap:anywhere
}
.export-button{
  width:100%;
  min-height:46px
}
.checks{
  font-size:11px;
  margin:13px 0 0;
  display:grid;
  gap:7px
}
.check-line{
  display:flex;
  align-items:flex-start;
  gap:7px
}
.check-line .symbol{
  font-size:13px;
  line-height:1.35;
  font-weight:700;
  color:var(--warning)
}
.check-line.blocking .symbol{
  color:var(--error)
}
.check-line.ready .symbol{
  color:var(--success)
}
.check-line span:last-child{
  color:var(--text-muted)
}
.bottom-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:var(--gap);
  margin-top:var(--gap)
}
.limit-summary{
  font-size:12px;
  color:var(--text-muted);
  margin:4px 0 12px
}
.limit-list{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px 18px;
  font-size:11px
}
.limit-item{
  padding:7px 0;
  border-bottom:1px solid var(--shadow-dark)
}
.limit-item span{
  display:block;
  color:var(--text-muted)
}
.limit-item b{
  font-weight:650;
  display:block;
  margin-top:3px
}
.guide{
  font-size:11px;
  margin-top:17px;
  color:var(--text-muted)
}
.guide summary{
  color:var(--text);
  cursor:pointer;
  min-height:27px
}
.guide ul{
  padding-left:17px;
  margin:6px 0 0
}
.guide li+li{
  margin-top:8px
}
.outputs{
  display:grid;
  gap:14px;
  max-height:300px;
  overflow:auto;
  padding:4px
}
.output-item{
  display:flex;
  gap:12px;
  align-items:center;
  border-radius:13px;
  box-shadow:var(--inset);
  padding:13px
}
.output-item .output-info{
  min-width:0;
  flex:1
}
.output-name{
  font-size:12px;
  font-weight:650;
  overflow-wrap:anywhere
}
.output-info small{
  display:block;
  margin-top:5px;
  font-size:10px
}
.output-item a{
  font-size:11px;
  flex-shrink:0;
  text-decoration:none
}
.no-output{
  padding:27px 15px;
  text-align:center;
  color:var(--text-muted);
  font-size:12px;
  box-shadow:var(--inset);
  border-radius:14px
}
.download-note{
  color:var(--text-muted);
  font-size:11px;
  margin-top:14px
}
.messages:empty{
  display:none
}
.messages{
  display:grid;
  gap:10px;
  margin-bottom:22px
}
.message{
  display:flex;
  gap:12px;
  align-items:flex-start;
  padding:14px 17px;
  border-radius:14px;
  box-shadow:var(--inset);
  background:var(--surface);
  border-left:3px solid var(--accent)
}
.message.error{
  border-color:var(--error)
}
.message.warning{
  border-color:var(--warning)
}
.message.success{
  border-color:var(--success)
}
.message p{
  flex:1;
  font-size:12px;
  overflow-wrap:anywhere
}
.message button{
  background:transparent;
  color:var(--text-muted);
  font-size:18px;
  min-width:28px;
  line-height:24px
}
.progress-panel{
  margin-top:18px;
  box-shadow:var(--inset);
  padding:16px;
  border-radius:14px
}
.progress-panel .progress-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:12px;
  font-weight:600
}
.progress-track{
  height:8px;
  border-radius:5px;
  box-shadow:var(--inset);
  margin:13px 0;
  overflow:hidden;
  background:var(--bg)
}
.progress-fill{
  width:0;
  height:100%;
  background:var(--accent);
  border-radius:5px;
  transition:width .15s linear
}
.progress-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  font-size:11px;
  color:var(--text-muted)
}
.processing-banner{
  margin-top:10px;
  color:var(--warning);
  font-size:11px
}
footer{
  display:flex;
  justify-content:space-between;
  gap:15px;
  color:var(--text-muted);
  font-size:10px;
  padding:27px 3px 0;
  flex-wrap:wrap
}
dialog{
  border:0;
  padding:25px;
  max-width:430px;
  width:calc(100% - 36px);
  background:var(--surface);
  color:var(--text);
  border-radius:var(--radius);
  box-shadow:var(--raised)
}
dialog::backdrop{
  background:rgba(10,15,24,.45)
}
.about-grid{
  display:grid;
  grid-template-columns:100px 1fr;
  gap:12px;
  font-size:13px;
  margin:22px 0
}
.about-grid dt{
  color:var(--text-muted)
}
.about-grid dd{
  margin:0;
  overflow-wrap:anywhere
}
.about-note{
  font-size:12px;
  color:var(--text-muted);
  margin-bottom:20px
}
.modal-close{
  float:right
}
.sr-only{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0
}
[hidden]{
  display:none!important
}
body.busy .mode-switch button{
  pointer-events:none
}
body.busy #previewVideo{
  pointer-events:none
}
.tabular{
  font-variant-numeric:tabular-nums
}
@media(min-width:1350px){
  .grid{
    grid-template-columns:280px minmax(400px,1fr) 318px
  }
  .clip-name{
    max-width:155px
  }
}
@media(max-width:1150px){
  .shell{
    padding:23px
  }
  .grid{
    grid-template-columns:230px 1fr
  }
  .settings-panel{
    grid-column:1/-1;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 28px
  }
  .settings-panel>.section-head{
    grid-column:1/-1
  }
  .settings-controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 16px
  }
  .settings-controls>.field:first-child{
    margin-top:16px
  }
  .export-area{
    align-self:center
  }
  .local-badge{
    display:none
  }
  .clip-name{
    max-width:120px
  }
}
@media(max-width:760px){
  .grid{
    grid-template-columns:minmax(0,1fr)
  }
  .grid>.panel{
    min-width:0
  }
  .preview-actions{
    flex-wrap:wrap
  }
  .shell{
    padding:18px
  }
  .topbar{
    align-items:flex-start;
    gap:15px;
    margin-bottom:26px
  }
  .top-controls{
    flex-wrap:wrap;
    justify-content:flex-end;
    gap:10px
  }
  .top-controls .button{
    padding:10px;
    font-size:11px
  }
  .brand-mark{
    display:none
  }
  .brand-name{
    font-size:20px
  }
  .brand-sub{
    font-size:8px;
    letter-spacing:1px
  }
  #languageSelect{
    width:117px;
    font-size:12px
  }
  .top-controls .icon-button{
    width:38px
  }
  .intro{
    display:block
  }
  .intro p{
    font-size:12px
  }
  .grid{
    grid-template-columns:minmax(0,1fr)
  }
  .panel{
    padding:18px
  }
  .library-panel{
    grid-row:auto
  }
  .clip-list{
    flex-direction:row;
    max-height:none;
    overflow-x:auto;
    max-width:100%;
    margin-top:16px
  }
  .clip-card{
    min-width:195px
  }
  .clip-name{
    max-width:110px
  }
  .dropzone{
    display:flex;
    align-items:center;
    justify-content:space-between;
    text-align:left;
    padding:16px;
    gap:12px
  }
  .drop-icon,.dropzone p{
    display:none
  }
  .dropzone small{
    max-width:160px
  }
  .library-note{
    margin-top:12px
  }
  .settings-panel{
    display:block;
    grid-column:auto
  }
  .settings-controls{
    display:grid
  }
  .bottom-grid{
    grid-template-columns:1fr
  }
  .video-stage{
    margin-top:15px
  }
  .time-input-row input{
    font-size:11px
  }
  .topbar .brand{
    margin-top:8px
  }
  .about-grid{
    grid-template-columns:90px 1fr
  }
  .intro h1{
    font-size:26px
  }
  footer{
    font-size:10px
  }
  .output-item{
    flex-wrap:wrap
  }
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    transition:none!important;
    scroll-behavior:auto!important
  }
}

/* Línea temporal: una misma escala geométrica para controles, marcas y cursor. */
.timeline{height:82px;overflow:visible;margin:12px 0 5px;touch-action:none}
.timeline-track{position:absolute;left:15px;right:15px;top:37px;height:25px;cursor:crosshair;touch-action:none}
.timeline-selection{top:3px;bottom:3px;border-radius:3px}
.timeline-playhead{top:-9px;bottom:-9px;width:2px;transform:translateX(-1px);z-index:4;pointer-events:none}
.timeline-ticks{position:absolute;left:15px;right:15px;top:8px;bottom:8px;pointer-events:none}
.timeline-tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--shadow-dark)}
.timeline-tick span{position:absolute;top:0;transform:translateX(-50%);font-size:9px;color:var(--text-muted);white-space:nowrap;font-variant-numeric:tabular-nums;background:var(--surface);padding:0 3px}
.timeline-tick:first-child span{transform:none}.timeline-tick:last-child span{transform:translateX(-100%)}
.timeline-handle{position:absolute;top:-7px;bottom:auto;width:28px;height:39px;min-height:0;padding:0;transform:translateX(-50%);background:var(--accent);color:#fff;border-radius:7px;font-size:17px;font-weight:700;box-shadow:var(--raised-small);z-index:5;cursor:ew-resize;touch-action:none}
.timeline-split{width:25px;background:var(--accent-dark);font-size:12px;z-index:6}
.timeline-handle::before{content:attr(data-time);position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);font-size:10px;font-weight:600;background:var(--surface);color:var(--text);padding:3px 5px;border-radius:5px;box-shadow:var(--raised-small);opacity:0;pointer-events:none}
.timeline-handle:hover::before,.timeline-handle:focus-visible::before{opacity:1}
.timeline-actual{position:absolute;top:-5px;bottom:-5px;border-left:2px dashed var(--warning);pointer-events:none;z-index:3}
#seekSlider{pointer-events:none;min-height:0;inset:0;z-index:2}
.range-fields>.field{margin-top:0}
.timeline-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px}
.timeline-transport,.timeline-zoom{display:flex;align-items:center;gap:7px;min-width:0}
.timeline-transport output{font-size:12px;min-width:91px;text-align:center}
.timeline-zoom label{font-size:10px;color:var(--text-muted)}
.timeline-zoom .select{min-height:30px;padding:5px 18px 5px 7px;font-size:11px;max-width:68px}
.timeline-tools .button{min-height:30px;padding:5px 9px}
#timelinePrecisionNote{font-size:10px;line-height:1.5;margin-top:9px}
.rotate-panel{padding:16px;margin-top:16px;border-radius:14px;box-shadow:var(--inset)}
.rotation-options{display:flex;gap:10px;flex-wrap:wrap;margin:13px 0}
.rotation-options [aria-pressed=true]{background:var(--accent);color:#fff;box-shadow:var(--inset)}
@media(max-width:760px){.settings-controls{grid-template-columns:minmax(0,1fr)}.mode-switch{gap:2px}.mode-switch button{font-size:11px;padding:9px 5px}.timeline-tools{gap:12px}.timeline-zoom{gap:5px}}

.preview-actions{flex-wrap:wrap;gap:10px}
.preview-export-button{color:var(--warning)}
.preview-actions [aria-pressed=true]{box-shadow:var(--inset)}
.preview-status{border-left:3px solid var(--accent);padding:9px 12px;margin-top:10px;border-radius:7px;font-size:11px;font-variant-numeric:tabular-nums;background:var(--bg);overflow-wrap:anywhere}
.preview-status.export-preview{border-left-color:var(--warning)}
.preview-legend{font-size:10px;line-height:1.5;margin-top:10px}
</style>

/*
PROJECT REQUIREMENTS — DO NOT REMOVE
INSTRUCCIÓN GENERAL

Desarrolla la aplicación descrita al inicio de este documento. Respeta todas las reglas establecidas a continuación durante la creación, corrección, mantenimiento y evolución del proyecto.

Estas reglas constituyen el CONTRATO DE REQUISITOS PERMANENTES DEL PROYECTO. Son acumulativas y obligatorias, salvo que el usuario autorice explícitamente una excepción o modificación. Una solicitud posterior que omita un requisito anterior NO implica su cancelación.

======================================================================
REGLA 01 — PERSISTENCIA Y CONSERVACIÓN DE REQUISITOS
======================================================================

1.1. Requisitos permanentes

- Conserva todas las reglas, restricciones, funcionalidades, especificaciones técnicas y decisiones de diseño vigentes en las versiones posteriores.
- Interpreta las nuevas solicitudes como cambios o ampliaciones del proyecto existente, no como su sustitución completa.
- No elimines, simplifiques, deshabilites ni sustituyas funciones anteriores sin autorización explícita.
- Mantén intactas las funciones que ya operan correctamente y evita regresiones.
- No alteres la arquitectura, la apariencia ni el comportamiento existente fuera de lo necesario para implementar los cambios solicitados.
- La ausencia de una regla en un prompt futuro no autoriza a ignorarla.

1.2. Jerarquía para resolver cambios

1. Modificaciones explícitamente autorizadas por el usuario.
2. Requisitos permanentes de este contrato que continúen vigentes.
3. Requisitos funcionales acumulados de versiones anteriores.
4. Requisitos específicos de la versión actual.
5. Decisiones técnicas del implementador que no contradigan lo anterior.

Una autorización explícita sustituye únicamente los requisitos afectados. Los demás continúan vigentes. Si una solicitud produce un conflicto irresoluble, identifica el conflicto y solicita aclaración solo cuando sea indispensable.

1.3. Registro integrado en el archivo

Incluye y conserva una sección de comentarios HTML o JavaScript identificada exactamente como:

PROJECT REQUIREMENTS — DO NOT REMOVE

Documenta allí, con una estructura legible:
- Restricciones técnicas permanentes.
- Funcionalidades obligatorias y comportamientos esperados.
- Arquitectura y decisiones de diseño relevantes.
- Idiomas, reglas de redacción y traducción.
- Temas, paleta y reglas de interfaz.
- Requisitos específicos del proyecto.
- Excepciones y cambios autorizados.
- Historial de versiones, o referencia a su sección dentro del mismo HTML.

Actualiza este registro cuando cambien los requisitos. Nunca lo elimines ni alteres silenciosamente los requisitos históricos.

IMPORTANTE: Este registro facilita recuperar los requisitos al volver a proporcionar el HTML en una conversación nueva, pero no garantiza que una IA conserve memoria fuera del contexto disponible. Si no tienes acceso a la última versión del archivo o a requisitos esenciales anteriores, no afirmes haberlos revisado.

======================================================================
REGLA 02 — APLICACIÓN HTML5, ARCHIVO ÚNICO Y FUNCIONAMIENTO OFFLINE
======================================================================

2.1. Tecnologías

Utiliza exclusivamente HTML5, CSS3, JavaScript puro (Vanilla JavaScript) y APIs nativas del navegador compatibles con la ejecución local.

2.2. Archivo autocontenido

Entrega un único archivo .html. Incluye dentro de él todo lo necesario para ejecutar la aplicación:
- HTML y CSS.
- JavaScript.
- Iconos y recursos gráficos.
- Traducciones y configuraciones.
- Metadatos y componentes de interfaz.
- Datos y recursos estáticos necesarios.

No generes archivos adicionales indispensables para la ejecución.

2.3. Independencia de Internet

No utilices dependencias de ejecución externas, como:
- CDN, librerías o frameworks remotos.
- Fuentes externas, hojas de estilo externas o scripts remotos.
- Imágenes, iconos u otros recursos descargados dinámicamente.
- APIs o servicios web obligatorios.

La aplicación y sus funciones esenciales deben funcionar sin conexión al abrir directamente el archivo HTML en un navegador moderno mediante el protocolo file://.

Los enlaces informativos externos, como GitHub, están permitidos si son opcionales y no afectan a la funcionalidad offline. Al abrirlos, la conexión a Internet podrá ser necesaria solamente para acceder al destino.

2.4. Compatibilidad y límites técnicos

- Usa APIs que funcionen en el contexto local y detecta su disponibilidad antes de usarlas.
- Si una API requiere permisos, un contexto seguro, un códec particular o tiene restricciones por navegador, documenta la limitación y ofrece manejo de errores adecuado.
- No prometas compatibilidad universal con formatos, dispositivos o navegadores sin verificarla.
- Si un requisito no puede implementarse de forma fiable dentro de estas restricciones, explica la limitación técnica en vez de simular la función o introducir una dependencia prohibida sin autorización.

======================================================================
REGLA 03 — ARQUITECTURA, ORGANIZACIÓN Y MANTENIBILIDAD
======================================================================

3.1. Principios

Desarrolla una arquitectura clara, modular, lógica y fácil de mantener. Prioriza:
- Código simple, legible, ordenado y dividido por responsabilidades.
- Funciones y módulos pequeños, reutilizables y con nombres descriptivos.
- Flujo de ejecución comprensible y fácil de depurar.
- Bajo acoplamiento entre componentes.
- Configuraciones, constantes y parámetros relacionados centralizados.
- Manejo explícito de errores y estados.
- Localización, diagnóstico y corrección sencilla de problemas.

Evita código duplicado o muerto, dependencias ocultas, funciones monolíticas, variables globales innecesarias, valores mágicos dispersos, CSS contradictorio, soluciones temporales opacas y abstracciones excesivas.

3.2. Organización interna sugerida

Aunque todo el código pertenezca a un único archivo, separa lógicamente:
1. Metadatos y configuración general.
2. Registro de requisitos y versiones.
3. Estilos, variables visuales y temas.
4. Estructura de la interfaz HTML.
5. Internacionalización y traducciones.
6. Preferencias y estado de la aplicación.
7. Lógica funcional principal.
8. Utilidades, validaciones y tratamiento de errores.
9. Inicialización y gestión de eventos.

Adapta las secciones a la complejidad real; no crees módulos artificiales.

3.3. Convenciones

Mantén nombres técnicos en inglés para variables, constantes, funciones, clases, propiedades, estructuras de datos e IDs. Usa nombres coherentes, descriptivos y consistentes.

3.4. Comentarios y documentación interna EN ESPAÑOL

Documenta todas las secciones importantes, funciones, variables complejas, componentes y bloques de lógica. Explica según corresponda:
1. Qué hace.
2. Para qué sirve.
3. Por qué se implementó así cuando la decisión no sea evidente.
4. Qué efecto tiene sobre la lógica o la interfaz.
5. Qué habría que modificar para cambiar ese comportamiento.

No agregues comentarios redundantes que repitan lo evidente. La arquitectura y los comentarios deberán permitir que otra persona diagnostique y mantenga la aplicación sin conocer el proyecto previamente.

NOTA: Las reglas lingüísticas ASD-STE100 de la versión inglesa de la interfaz no obligan a escribir en inglés los comentarios internos. Estos permanecen en español por requisito explícito.

======================================================================
REGLA 04 — INTERFAZ NEOMORPHISM / SOFT UI
======================================================================

4.1. Diseño obligatorio

Diseña toda la UI/GUI exclusivamente con estilo Neomorphism / Soft UI. Mantén dos temas completos, Light y Dark, con selector que cambie el tema sin recargar la página.

4.2. Paleta Light — VALORES EXACTOS

--bg: #DFE4EA;
--surface: #E5E9EE;
--shadow-light: #FFFFFF;
--shadow-dark: #C2C6CA;
--text: #30363B;
--text-muted: #687078;
--accent-light: #6C9EFF;
--accent: #557BD9;
--accent-dark: #526FC0;

4.3. Paleta Dark — VALORES EXACTOS

--bg: #20252B;
--surface: #272C33;
--shadow-light: #323841;
--shadow-dark: #181C21;
--text: #E6EAF0;
--text-muted: #9CA6B2;
--accent-light: #739DF2;
--accent: #5C7FD6;
--accent-dark: #4868B8;

No alteres estos valores sin autorización explícita.

4.4. Aplicación visual

- Botones y tarjetas elevados con doble sombra clara y oscura.
- Inputs, selects, sliders y áreas editables hundidos con inset cuando sea apropiado.
- Gráficos y controles integrados visualmente con el estilo.
- Bordes suaves, radios redondeados y acentos azules discretos.
- Estados distinguibles para elementos activos, presionados, deshabilitados y seleccionados.
- Transiciones discretas, diseño adaptable a pantallas diferentes y legibilidad adecuada.

No mezcles Material Design, Glassmorphism, Flat Design ni sombras convencionales ajenas al estilo neumórfico.

Centraliza colores, sombras, radios, espaciados, dimensiones y transiciones en variables CSS reutilizables. Elimina duplicaciones y reglas contradictorias.

4.5. Comportamiento y persistencia

- Cambia de tema inmediatamente y aplica el cambio a todos los componentes.
- Guarda la selección en localStorage cuando esté disponible.
- Recupera la preferencia en posteriores aperturas del HTML.
- Si localStorage no está disponible, permite al menos cambiar el tema durante la sesión.
- Verifica la coherencia visual y la legibilidad de Light y Dark.

======================================================================
REGLA 05 — SISTEMA MULTILENGUAJE (i18n)
======================================================================

5.1. Idiomas obligatorios

- English (en): idioma predeterminado.
- Español (es).
- Italiano (it).
- Português (Brasil) (pt-BR).

5.2. Cobertura completa

Traduce todos los textos visibles o comunicados al usuario:
- Títulos, subtítulos, botones, menús y etiquetas.
- Campos, placeholders, descripciones e instrucciones.
- Mensajes informativos, de error, advertencia, confirmación y éxito.
- Alertas, modales, ventanas emergentes y tooltips.
- Ayudas, validaciones, estados de proceso y mensajes generados dinámicamente.
- Contenido visible del modal About.

Conserva sin traducir solamente los nombres propios, marcas, identificadores técnicos y términos que técnicamente deban permanecer iguales.

5.3. Selector y estado

- Inicia en inglés cuando no exista una preferencia guardada válida.
- Cambia de idioma sin recargar la página.
- Guarda la preferencia en localStorage cuando esté disponible.
- Restaura la selección al abrir la aplicación.
- Actualiza los componentes ya visibles y todos los mensajes posteriores.
- No borra ni altera datos del usuario cuando cambia el idioma.
- Usa inglés como respaldo ante claves o preferencias inválidas.
- Si el almacenamiento no está disponible, conserva el cambio durante la sesión actual.

5.4. Arquitectura de traducciones

- Centraliza los textos traducibles en una estructura i18n identificable y mantenible.
- Utiliza claves estables, consistentes y reutilizables.
- Evita duplicar cadenas visibles dentro de distintas funciones.
- Cada funcionalidad de interfaz nueva debe incorporar sus traducciones en los cuatro idiomas desde su primera entrega.
- La redacción y traducción deben respetar además la REGLA 06.

======================================================================
REGLA 06 — ASD-STE100 Y REDACCIÓN CLARA EN TODOS LOS IDIOMAS [NUEVA EN V1.1]
======================================================================

6.1. Inglés — ASD-STE100 como norma de referencia

TODOS los textos en inglés destinados al usuario deben redactarse conforme a los principios y reglas aplicables de ASD-STE100 (Simplified Technical English), especialmente en instrucciones, ayudas, descripciones técnicas, mensajes de estado, errores, advertencias y procedimientos.

Aplica, cuando resulte pertinente al tipo de texto:
- Vocabulario técnico controlado y preciso.
- Palabras sencillas, comunes y con significado uniforme.
- Frases cortas, directas y sin ambigüedades.
- Una acción o idea principal por oración cuando sea posible.
- Voz activa y construcciones gramaticales simples.
- Terminología consistente: un concepto debe tener siempre el mismo nombre.
- Instrucciones expresadas con verbos claros y directos.
- Descripciones que indiquen con precisión qué ocurre, qué significa y qué debe hacer el usuario.
- Eliminación de expresiones idiomáticas, lenguaje publicitario, metáforas, redundancias y frases innecesariamente complejas.
- Distinción clara entre instrucciones, descripciones, condiciones, advertencias y resultados.

Para etiquetas breves de la interfaz, adapta estos principios sin sacrificar su función o comprensión. Conserva intactos nombres de APIs, formatos, identificadores de código, unidades y terminología técnica que no deban traducirse o alterarse.

Si dispones del texto de la especificación ASD-STE100 aplicable, verifica también el vocabulario aprobado y las reglas concretas pertinentes. No afirmes que una traducción o aplicación tiene certificación o conformidad formal completa con ASD-STE100 sin una validación efectiva contra la especificación correspondiente.

6.2. Español, italiano y portugués de Brasil — simplicidad equivalente

Las versiones es, it y pt-BR deben conservar la MISMA CLARIDAD, PRECISIÓN, BREVEDAD Y CONSISTENCIA TERMINOLÓGICA que la versión inglesa basada en ASD-STE100.

En estos tres idiomas:
- Usa vocabulario sencillo, preciso y natural para hablantes nativos.
- Prefiere oraciones cortas y estructuras gramaticales directas.
- Expresa una acción o idea principal por oración cuando sea práctico.
- Usa términos técnicos correctos y consistentes en cada idioma.
- Evita regionalismos innecesarios, modismos, metáforas y lenguaje ambiguo.
- Elimina información redundante sin perder instrucciones ni advertencias importantes.
- Mantén inequívocos los botones, procedimientos, errores y mensajes de seguridad.
- Conserva el significado técnico, las condiciones, las unidades y las consecuencias expresadas en inglés.
- Adapta la sintaxis a cada idioma; NO hagas traducciones literales que resulten artificiales o incorrectas.
- Usa portugués de Brasil, no portugués europeo.

ASD-STE100 es una especificación para el inglés técnico: NO exijas una supuesta certificación ASD-STE100 para los otros tres idiomas. Transfiere sus principios de simplicidad y claridad mediante una traducción técnica natural.

6.3. Flujo obligatorio de redacción y traducción

1. Redacta primero el texto fuente en inglés con los principios de ASD-STE100 aplicables.
2. Revisa la claridad, los verbos, la terminología, la longitud y la ausencia de ambigüedad.
3. Traduce su significado técnico a es, it y pt-BR sin perder información relevante.
4. Revisa cada traducción como texto autónomo y natural, no como sustitución palabra por palabra.
5. Comprueba que instrucciones, estados, advertencias, unidades, nombres y condiciones sean coherentes entre idiomas.
6. Al añadir o modificar una cadena, actualiza y verifica los cuatro idiomas simultáneamente.

6.4. Calidad lingüística

- Usa una misma denominación para cada concepto técnico dentro de cada idioma.
- Evita sinónimos decorativos que puedan hacer pensar que dos etiquetas se refieren a funciones diferentes.
- No introduzcas información en una traducción que no exista en el significado de la versión fuente, ni elimines información importante.
- Evita textos truncados; adapta el diseño cuando una traducción sea más larga.
- Los mensajes de error deben indicar con claridad el problema y, cuando sea posible, una acción correctiva concreta.
- Las alertas de seguridad y los límites técnicos deben mantener su significado completo incluso cuando se busque brevedad.

6.5. Alcance

Esta regla se aplica a los textos de interfaz, ayuda y documentación de uso incorporados a la aplicación. No modifica la obligación de que los comentarios de código y la documentación interna para desarrolladores estén en español, según la REGLA 03.

======================================================================
REGLA 07 — BOTÓN ABOUT Y METADATOS
======================================================================

7.1. Botón obligatorio

Incluye un botón About que abra una ventana modal con:

7.2. Comportamiento del modal

- Diseño compacto, moderno y coherente con Neomorphism.
- Integración en los temas Light y Dark.
- Botón para cerrar y cierre con la tecla Esc.
- Uso correcto con teclado.
- Traducción completa de las etiquetas y textos mediante i18n (en, es, it, pt-BR).
- Redacción ajustada a la REGLA 06.

7.3. Fuente única de metadatos

Centraliza nombre, autor, versión y enlace GitHub en una sola configuración. El modal y los demás elementos de interfaz deben leer esos valores de esa fuente. No dupliques el número de versión en variables independientes.

======================================================================
REGLA 08 — CONTROL DE VERSIONES Y CHANGELOG
======================================================================

8.1. Versionado consistente

Utiliza un esquema coherente, por ejemplo:
- V1.0.0: primera versión.
- V1.0.1: corrección de errores.
- V1.1.0: nuevas funciones compatibles.
- V2.0.0: cambios mayores autorizados.

El número de versión de la APLICACIÓN es independiente del número de versión de este PROMPT MAESTRO.

8.2. Base de actualizaciones

- Usa siempre la última versión funcional del código disponible como base.
- No reconstruyas el proyecto desde cero si una modificación localizada es suficiente.
- Conserva funciones, configuraciones y datos anteriores no afectados.
- No inventes código, comportamiento o historial de una versión que no puedas examinar.

8.3. Historial acumulativo

Incluye en el archivo HTML una sección de comentarios identificada como:

CHANGELOG — VERSION HISTORY

Registra para cada versión:
- Número de versión.
- Funciones agregadas.
- Errores corregidos.
- Comportamientos modificados.
- Cambios arquitectónicos importantes.
- Requisitos incorporados, sustituidos o retirados por autorización.

Conserva el historial anterior.

======================================================================
REGLA 09 — PROCEDIMIENTO OBLIGATORIO PARA MODIFICACIONES
======================================================================

Fase 1. Análisis
1. Examina el código de la última versión disponible.
2. Revisa el contrato y el CHANGELOG.
3. Identifica los cambios pedidos y los componentes afectados.
4. Analiza dependencias, riesgos y efectos secundarios.

Fase 2. Implementación
1. Mantén el comportamiento existente que no deba cambiar.
2. Modifica solo lo necesario, con una arquitectura clara.
3. Conserva el estilo neumórfico y ambos temas.
4. Añade todas las traducciones siguiendo las REGLAS 05 y 06.
5. Actualiza o añade comentarios en español donde corresponda.

Fase 3. Integración
1. Verifica los módulos y estados compartidos.
2. Revisa las interacciones y posibles regresiones.
3. Actualiza los requisitos internos, la versión y el CHANGELOG.

Fase 4. Entrega
1. Proporciona la aplicación completa actualizada.
2. No entregues solamente fragmentos de código o instrucciones de parcheo, salvo solicitud expresa.
3. Declara claramente qué pudiste verificar y qué pruebas quedaron pendientes.

======================================================================
REGLA 10 — VERIFICACIÓN TÉCNICA Y CONTROL DE CALIDAD
======================================================================

10.1. Exactitud

- No inventes APIs, resultados, parámetros, datos ni comportamientos.
- Investiga y verifica cuando exista una duda técnica importante.
- No supongas que una función opera correctamente sin analizarla o probarla.
- Documenta restricciones reales de APIs, permisos, formatos y navegadores.

10.2. Pruebas funcionales

Siempre que el entorno lo permita, verifica:
- Casos normales, límites y entradas inválidas.
- Errores esperados, operaciones repetidas y cambios de estado.
- Cálculos, conversiones y dependencias.
- Interacciones entre módulos y flujos de trabajo completos.

10.3. Revisión estática

Busca y corrige:
- Errores sintácticos y lógicos.
- Condiciones no contempladas.
- Estados o variables mal inicializados.
- Código muerto, duplicación y dependencias inexistentes.
- Problemas de eventos, incompatibilidades y efectos secundarios.
- Conflictos de estilos o presentación.

10.4. Lista de verificación específica

- Un único archivo HTML completo.
- Ejecución offline sin dependencias obligatorias de red.
- Funcionamiento desde file:// cuando corresponda.
- Selector de idiomas y persistencia de preferencias.
- Cobertura i18n en los cuatro idiomas.
- Inglés claro de acuerdo con los principios aplicables de ASD-STE100.
- Español, italiano y portugués brasileño con la misma simplicidad y precisión.
- Equivalencia semántica y terminológica entre los cuatro idiomas.
- Temas Light/Dark y coherencia visual Neomorphism.
- Modal About, cierre con Esc y metadatos sincronizados.
- Conservación de funcionalidades y requisitos anteriores.
- Versión y CHANGELOG actualizados.

10.5. Honestidad de las pruebas

Distingue expresamente entre:
- Pruebas ejecutadas y aprobadas.
- Inspecciones estáticas del código.
- Pruebas no ejecutadas por limitaciones del entorno.
- Problemas y restricciones conocidos.

No declares pruebas superadas si no las ejecutaste. No afirmes conformidad ASD-STE100 certificada si no se hizo la comprobación formal correspondiente. Prioriza exactitud y robustez sobre rapidez.

======================================================================
REGLA 11 — ENTREGA FINAL
======================================================================

11.1. Archivo

Entrega el archivo .html completo, descargable y listo para abrir localmente, cuando el entorno permita generar archivos. Incluye todas las dependencias requeridas dentro del propio HTML.

11.2. Resumen de entrega

Indica de forma concisa:
- Nombre de la aplicación y versión entregada.
- Funciones añadidas y errores corregidos.
- Cambios importantes.
- Verificaciones realizadas y pendientes.
- Limitaciones conocidas.

11.3. Integridad

No reduzcas calidad, comentarios necesarios, funcionalidades o requisitos solo para disminuir el tamaño del archivo o acelerar la entrega.

======================================================================
REGLA 12 — AMPLIACIÓN DEL PROMPT MAESTRO
======================================================================

Cuando el usuario proporcione nuevas reglas:
1. Lee y analiza las reglas anteriores y las nuevas.
2. Identifica duplicaciones, diferencias y posibles conflictos.
3. Incorpora cada regla nueva en la sección lógica apropiada.
4. Consolida repeticiones sin perder ninguna obligación.
5. Conserva todas las condiciones anteriores no sustituidas explícitamente.
6. Actualiza la versión del PROMPT MAESTRO.
7. Mantén numeración, terminología y estructura coherentes.
8. Si se solicita un archivo actualizado, entrega el texto maestro COMPLETO, no solo las nuevas cláusulas.

PRINCIPIO FUNDAMENTAL
======================================================================

Cada versión de la aplicación debe cumplir simultáneamente:
1. Los requisitos permanentes vigentes.
2. Las funcionalidades anteriores no eliminadas explícitamente.
3. Las modificaciones previamente autorizadas.
4. Los requisitos de la versión actual.
5. Los estándares de arquitectura, interfaz, traducción, calidad y compatibilidad de este contrato.

NINGÚN CAMBIO DEBE CAUSAR LA PÉRDIDA SILENCIOSA DE UNA FUNCIÓN O UN REQUISITO ANTERIOR.

que la inspección acotada no identifica todos los metadatos de color.

Solo se persisten el idioma y el tema; los videos y resultados viven en memoria.
Exportación cancelada si la pestaña se oculta, la decodificación falla, la captura
se atrasa de forma grave o la salida supera el presupuesto. No se guarda un archivo
parcial. Los originales no se modifican. Los resultados requieren descarga explícita.

  };
  const $ = id => document.getElementById(id);
  const ui = Object.fromEntries(Array.from(document.querySelectorAll('[id]')).map(node=>[node.id,node]));
  const state = {
    language:'en',theme:'light',clips:[],activeId:null,mode:'trim',busy:false,importing:false,previewRange:false,
    outputs:[],messages:[],formats:[],abortController:null,progress:null,audio:null,previousVolume:100
  };
  /* La selección azul y los cortes efectivos son dos consultas independientes.
     Ninguna vista previa modifica rangos, exporta ni inicia una conversión. */
  const previewControl={generation:0,frame:null,timer:null,session:null,starting:false};
  function clearPreviewWatch(){
    clearTimeout(previewControl.timer);previewControl.timer=null;
    if(previewControl.frame!==null){
      if(ui.previewVideo.cancelVideoFrameCallback)ui.previewVideo.cancelVideoFrameCallback(previewControl.frame);
      else cancelAnimationFrame(previewControl.frame);
      previewControl.frame=null;
    }
  }
  function paintPreviewState(){
    const session=previewControl.session,playing=state.previewRange&&!ui.previewVideo.paused;
    const whole=state.mode==='join'||state.mode==='rotate';
    for(const [button,kind] of [[ui.previewButton,'selection'],[ui.previewExportButton,'export']]){
      const active=playing&&session?.kind===kind;
      button.setAttribute('aria-pressed',String(active));
      button.querySelector('use').setAttribute('href',active?'#icon-pause':'#icon-play');
    }
    ui.previewButton.querySelector('span').textContent=t(whole?'previewFullVideo':'previewSelection');
    ui.previewStatus.hidden=!session;
    if(!session)ui.previewStatus.textContent='';
    if(session){
      ui.previewStatus.classList.toggle('export-preview',session.kind==='export');
      ui.previewStatus.textContent=t('previewIntervalStatus',{
        type:t(session.kind==='export'?'previewExport':whole?'previewFullVideo':'previewSelection'),
        start:formatTime(session.start),end:formatTime(session.end),duration:formatTime(session.end-session.start),
        status:t(session.status==='complete'?'previewComplete':session.status==='paused'?'previewPaused':'previewPlaying')
      });
    }
  }
  function stopRangePreview({clear=false,complete=false,pause=true}={}){
    previewControl.generation++;clearPreviewWatch();previewControl.starting=false;state.previewRange=false;
    const session=previewControl.session,video=ui.previewVideo;
    if(pause&&!state.busy)video.pause();
    if(session){
      session.status=complete?'complete':'paused';
      if(complete&&!state.busy&&session.clipId===state.activeId&&Math.abs(video.currentTime-session.end)>.0001)video.currentTime=session.end;
    }
    if(clear)previewControl.session=null;
    paintPreviewState();
  }
  function previewSessionValid(){
    const session=previewControl.session,clip=activeClip();
    return session&&clip&&session.clipId===clip.id&&session.operation===state.mode&&
      Math.abs(session.selectedStart-clip.start)<.0005&&Math.abs(session.selectedEnd-clip.end)<.0005&&
      Math.abs(session.split-clip.split)<.0005;
  }
  function renderPreviewControls(plan){
    const clip=activeClip(),cutting=state.mode==='trim'||state.mode==='split',showExport=cutting&&plan.original;
    const unavailable=!clip||clip.previewUnavailable||state.busy||state.importing;
    ui.previewExportButton.hidden=!showExport;ui.previewLegend.hidden=!showExport;
    ui.previewButton.disabled=!!unavailable;
    ui.previewExportButton.disabled=!!unavailable||plan.errors.length>0;
    ui.previewButton.title=t(cutting?'previewSelectionHelp':'previewFullVideo');
    ui.previewExportButton.title=plan.errors.length?t(plan.errors[0][0],plan.errors[0][1]):t('previewExportHelp');
    if(previewControl.session&&(!previewSessionValid()||state.busy||(previewControl.session.kind==='export'&&(!showExport||plan.errors.length))))stopRangePreview({clear:true});
    paintPreviewState();
  }
  function checkPreviewBoundary(){
    if(!state.previewRange)return false;
    if(state.busy||!previewSessionValid()){
      stopRangePreview({clear:true,pause:!state.busy});return false;
    }
    if(ui.previewVideo.currentTime>=previewControl.session.end-.001){
      stopRangePreview({complete:true});updatePlayhead();return false;
    }
    return true;
  }
  function watchPreviewBoundary(){
    clearPreviewWatch();
    const video=ui.previewVideo;
    function frame(){
      previewControl.frame=null;
      if(!checkPreviewBoundary())return;
      updatePlayhead();
      previewControl.frame=video.requestVideoFrameCallback?video.requestVideoFrameCallback(frame):requestAnimationFrame(frame);
    }
    function timer(){
      previewControl.timer=null;
      if(!checkPreviewBoundary())return;
      const remaining=(previewControl.session.end-video.currentTime)/Math.max(.1,video.playbackRate);
      previewControl.timer=setTimeout(timer,Math.max(4,Math.min(100,remaining*1000)));
    }
    frame();timer();
  }
  async function startRangePreview(kind){
    const clip=activeClip(),video=ui.previewVideo;
    if(!clip||clip.previewUnavailable||state.busy||state.importing)return;
    if(state.previewRange&&previewControl.session?.kind===kind&&!video.paused){stopRangePreview();return;}
    stopRangePreview({clear:true});
    if(!commitEditorInputs())return;
    let {start,end}=operationSegment(clip);
    if(kind==='export'){
      const plan=buildPlan();
      if(!plan.original||!['trim','split'].includes(state.mode))return;
      if(plan.errors.length){notify(plan.errors[0][0],plan.errors[0][1],'error');return;}
      const ranges=plan.groups.flat().filter(part=>part.clip.id===clip.id);
      if(!ranges.length)return;
      start=ranges[0].start;end=ranges[ranges.length-1].end;
    }
    const generation=previewControl.generation;
    previewControl.starting=true;
    try{
      if(state.audio)await state.audio.context.resume();
      await seekVideo(video,start,undefined,.0001);
      if(generation!==previewControl.generation||state.activeId!==clip.id)return;
      previewControl.session={kind,clipId:clip.id,operation:state.mode,start,end,selectedStart:clip.start,selectedEnd:clip.end,split:clip.split,status:'playing'};
      state.previewRange=true;
      await video.play();
      if(generation!==previewControl.generation)return;
      previewControl.starting=false;
      paintPreviewState();watchPreviewBoundary();
    }
    catch(error){
      if(generation!==previewControl.generation)return;
      stopRangePreview({clear:true});notify(error.appKey||'playBlocked',error.appValues,'error');
    }
    finally{
      if(generation===previewControl.generation)previewControl.starting=false;
    }
  }

  /* Traducción y preferencias. Se conservan claves de mensaje para retraducir estados
   dinámicos sin perder archivos, rangos, resultados ni mensajes ya visibles. */
  function t(key, values={
  }) {
    const dictionary=I18N[state.language]||I18N.en;
    const resolved=Number(values.count)===1&&dictionary[key+'One']?key+'One':key;

      stream.getTracks().forEach(track=>track.stop());
      stream=canvas.captureStream(plan.fps);
      captureTrack=null;
    }
    plan.captureTrack=captureTrack;
    let recorder=null;
    const chunks=[];
    let bytes=0,recordingMilliseconds=0;
    const duration=group.reduce((sum,segment)=>sum+segment.end-segment.start,0);
    try{
      if(plan.volume>0){
        const audio=state.audio;
        audio.gain.gain.value=0;
        stream.addTrack(audio.destination.stream.getAudioTracks()[0].clone());
      }
      const mime=plan.mime||supportedMime(plan.format,plan.volume>0);
      if(!mime)throw appError('noEncoder');
      try{
        recorder=new MediaRecorder(stream,{
          mimeType:mime,videoBitsPerSecond:Math.round(plan.bitrate*1e6),...(plan.volume>0?{
            audioBitsPerSecond:plan.audioBitrate||LIMITS.audioBitrate
          }:{
          })
        });
      }
      catch{
        throw appError('encoderError');
      }
      recorder.addEventListener('dataavailable',event=>{
        if(!event.data.size||signal.aborted)return;
        bytes+=event.data.size;
        if(bytes>LIMITS.maxOutputBytes||plan.retained+pendingBytes+bytes>LIMITS.maxResultBytes){
          state.abortController?.abort(appError('actualOutputLimit',{
            limit:formatBytes(LIMITS.maxOutputBytes)
          }));
          return;
        }
        chunks.push(event.data);
      });
      recorder.addEventListener('error',()=>state.abortController?.abort(appError('encoderError')));
      recorder.start(LIMITS.chunkMilliseconds);
      let completed=0;
      for(let index=0;
      index<group.length;
      index++){
        checkAbort(signal);
        const segment=group[index];
        if(index){
          await setVideoSource(video,segment.clip.url,signal);
          await seekVideo(video,segment.start,signal);
          drawFrame(context,video,plan.size,plan.rotation||0);
          await resumeRecorder(recorder,signal);
        }
        if(state.audio)state.audio.gain.gain.value=plan.volume;
        const started=performance.now();
        await captureSegment(segment,plan,context,signal,baseProgress+completed);
        recordingMilliseconds+=performance.now()-started;
        if(state.audio)state.audio.gain.gain.value=0;
        completed+=segment.end-segment.start;
        if(index<group.length-1)await pauseRecorder(recorder,signal);
      }
      const stopped=recorderEvent(recorder,'stop',signal);
      recorder.stop();
      await stopped;
      checkAbort(signal);
      if(!bytes)throw appError('emptyOutput');
      let blob=new Blob(chunks,{
        type:recorder.mimeType.split(';')[0]
      });
      if(plan.format.id==='webm')blob=await fixWebmDuration(blob,recordingMilliseconds/1000);
      if(blob.size>LIMITS.maxOutputBytes||plan.retained+pendingBytes+blob.size>LIMITS.maxResultBytes)throw appError('actualOutputLimit',
      {
        limit:formatBytes(LIMITS.maxOutputBytes)
      });
      return{
        blob,duration,width:plan.size.width,height:plan.size.height
      };
    }
    finally{
      if(recorder&&recorder.state!=='inactive')try{
        recorder.stop();
      }
      catch{
        /* Ya detenido por un error del navegador. */
      }
      stream.getTracks().forEach(track=>track.stop());
      video.pause();
      if(state.audio)state.audio.gain.gain.value=0;
    }
  }
  /* Transacción de exportación: desactiva mutaciones, conserva resultados anteriores,
   solicita mantener pantalla activa si existe la API, y restaura SIEMPRE la vista.
   Las alertas conocidas se traducen; no se exponen excepciones técnicas opacas. */
  async function exportReencodedVideos(){
    if(state.busy||state.importing)return;
    if(!commitEditorInputs())return;
    const plan=buildPlan();
    if(plan.errors.length){
      notify(plan.errors[0][0],plan.errors[0][1],'error');
      return;
    }
    stopRangePreview({clear:true});
    state.busy=true;
    state.activeEngine='reencode';
    state.abortController=new AbortController();
    const signal=state.abortController.signal;
    const initialClipId=state.activeId,initialTime=ui.previewVideo.currentTime,initialMuted=ui.previewVideo.muted,
    initialRate=ui.previewVideo.playbackRate;
    state.progress={
      done:0,total:plan.duration,started:performance.now(),group:1,groups:plan.groups.length
    };
    let wakeLock=null;
    ui.previewVideo.pause();
    ui.previewVideo.volume=1;
    ui.previewVideo.muted=false;
    ui.previewVideo.playbackRate=1;
    ui.progressPanel.hidden=false;
    ui.exportCanvas.hidden=false;
    renderAll();
    ui.progressNotice.textContent=t('keepOpen');
    const pending=[];
    try{
      if(plan.volume>0||state.audio){
        const audio=await ensureAudio();
        audio.monitor.gain.value=0;
        audio.gain.gain.value=0;
      }
      if(document.hidden)throw appError('tabHidden');
      if(navigator.wakeLock?.request)try{
        wakeLock=await navigator.wakeLock.request('screen');
      }
      catch{
        /* El aviso exige mantener pantalla activa aun sin Wake Lock. */
      }
      let completed=0,pendingBytes=0;
      for(let i=0;
      i<plan.groups.length;
      i++){
        checkAbort(signal);
        state.progress.group=i+1;
        renderProgress();
        let result=await recordGroup(plan.groups[i],plan,signal,completed,pendingBytes);
        if(plan.compression)result=await finalizeCompressionResult(result,plan.groups[i],plan,signal,pendingBytes);
        const suffix=state.mode==='rotate'?'_rotated-'+requestedRotation()+(plan.compression?'_compressed':''):plan.compression?(state.mode==='split'?'_compressed_part-'+(i+1):state.mode==='join'?'_compressed_joined':'_compressed'):(state.mode==='split'?'_part-'+(i+1):state.mode==='join'?'_joined':'_edited');
        const base=state.mode==='join'?CONFIG.name:safeBase(plan.groups[i][0].clip.file.name);
        const usedNames=new Set([...state.outputs,...pending].map(item=>item.name));
        let name=base+suffix+'.'+plan.format.extension;
        let duplicate=2;
        while(usedNames.has(name)){
          name=base+suffix+'-'+duplicate+'.'+plan.format.extension;
          duplicate++;
        }
        result.name=name;
        pending.push(result);
        pendingBytes+=result.blob.size;
        completed+=result.duration;
      }
      checkAbort(signal);
      for(const result of pending){
        result.url=URL.createObjectURL(result.blob);
        state.outputs.push(result);
      }
      ui.progressFill.style.width='100%';
      ui.progressPercent.textContent='100%';
      ui.progressBar.setAttribute('aria-valuenow','100');
      notify('exportSuccess',{
        count:pending.length
      },'success');
      if(pending.reduce((sum,item)=>sum+item.blob.size,0)>plan.bytes*1.25)notify('estimateExceeded',{
      },'warning');
    }
    catch(error){
      const reason=signal.aborted?signal.reason:error;
      console.warn('VideoSquiser: exportación detenida',reason);
      notify(plan.compression&&['encoderError','noEncoder','emptyOutput'].includes(reason?.appKey)?'compressionEncoderFailed':reason?.appKey||'exportFailed',
      reason?.appValues,reason?.appKey==='cancelled'?'info':'error');
    }
    finally{
      ui.previewVideo.pause();
      if(state.audio){
        state.audio.gain.gain.value=0;
        state.audio.monitor.gain.value=1;
      }
      if(wakeLock)try{
        await wakeLock.release();
      }
      catch{
        /* La pantalla pudo liberar el bloqueo previamente. */
      }
      state.busy=false;
      state.activeEngine=null;
      state.abortController=null;
      state.progress=null;
      ui.exportCanvas.hidden=true;
      ui.progressPanel.hidden=true;
      state.activeId=initialClipId;
      await selectClip(initialClipId);
      try{
        if(activeClip())await seekVideo(ui.previewVideo,initialTime);
      }
      catch{
        /* La vista inicial no debe impedir recuperar los controles. */
      }
      ui.previewVideo.volume=Number(ui.volumeSlider.value)/100;
      ui.previewVideo.muted=initialMuted;
      ui.previewVideo.playbackRate=initialRate;
      renderAll();
    }
  }
  /* Integración del modo original. Todas las decisiones de conversión pasan por el
   selector explícito de proceso. Un fallo de copia nunca activa el encoder. */
  function isSimpleJoin(){
    return state.mode==='join'&&!ui.joinSettingsToggle.checked;
  }
  function operationSegment(clip){
    const whole=state.mode==='join'||state.mode==='rotate';
    return {clip,start:whole?0:clip.start,end:whole?clip.duration:clip.end};
  }
  function isOriginalMode(){
    return isSimpleJoin()||ui.processingSelect.value==='original';
  }
  function getOperationClips(){
    const selected=activeClip();
    return state.mode==='join'?state.clips:selected?[selected]:[];
  }
  function sourceExtension(clip){
    return clip?.copyInfo?.extension||(clip?.file?.name||'').match(/\.([a-z0-9]{1,8})$/i)?.[1]?.toLowerCase()||'—';
  }
  function renderFormats(){
    const previous=ui.formatSelect.value;
    const withAudio=isSimpleJoin()||Number(ui.volumeSlider.value)>0;
    state.formats=FORMAT_CANDIDATES.filter(candidate=>supportedMime(candidate,withAudio));
    ui.formatSelect.replaceChildren();
    if(isOriginalMode()||isCompressionMode()){
      const extension=sourceExtension(getOperationClips()[0]);
      const option=makeElement('option','',t('originalFormat',{
        format:extension.toUpperCase()
      }));
      option.value=isCompressionMode()?'compress':'original';
      ui.formatSelect.append(option);
      ui.formatSelect.value=option.value;
    }
    else{
      for(const format of state.formats){
        const option=makeElement('option','',t(format.label));
        option.value=format.id;
        ui.formatSelect.append(option);
      }
      if(state.formats.some(format=>format.id===previous))ui.formatSelect.value=previous;
      else if(getOperationClips()[0]?.copyInfo?.kind==='mp4'&&state.formats.some(format=>format.id==='mp4'))ui.formatSelect.value='mp4';
      if(!state.formats.length){
        const option=makeElement('option','',t('noEncoder'));
        option.value='';
        ui.formatSelect.append(option);
      }
    }
  }
  /* Reutiliza las validaciones de rangos y presupuesto. La copia estima los bytes
   seleccionados y las tablas; no usa ni modifica bitrate, resolución o fps. */
  function buildCopyPlan(){
    const clips=getOperationClips(),selected=activeClip(),volume=isSimpleJoin()?1:Number(ui.volumeSlider.value)/100;
    let groups=clips.length?[clips.map(operationSegment)]:[];
    if(state.mode==='split'&&selected)groups=[[{
      clip:selected,start:selected.start,end:selected.split
    }],[{
      clip:selected,start:selected.split,end:selected.end
    }]];
    const errors=[],warnings=[];
    const retained=state.outputs.reduce((sum,item)=>sum+item.blob.size,0);
    let result={
      groups,duration:groups.flat().reduce((sum,part)=>sum+part.end-part.start,0),bytes:0,format:{
        id:'original',extension:sourceExtension(clips[0])
      },size:clips[0]?{
        width:clips[0].width,height:clips[0].height
      }:null,adjustments:[]
    };
    if(!clips.length)errors.push(['selectVideoFirst']);
    if(state.mode==='join'&&clips.length<2)errors.push(['needTwoVideos']);
    if(volume!==0&&volume!==1)errors.push(['copyAudioChange']);
    const invalid=groups.flat().some(part=>!Number.isFinite(part.start)||!Number.isFinite(part.end)||part.start<0||part.end>part.clip.duration+.011||part.end-part.start<LIMITS.minSegment);
    if(invalid)errors.push(['invalidRange',{
      min:LIMITS.minSegment,duration:formatTime(selected?.duration||0)
    }]);
    for(const clip of clips)if(!clip.copyInfo?.supported)errors.push([clip.copyInfo?.reason||'copyUnsupportedFormat',
    {
      name:clip.file.name
    }]);
    if(!errors.length){
      try{
        result=OriginalCopy.plan(groups,{
          mute:volume===0,splitPoint:state.mode==='split'?selected.split:null,rotation:requestedRotation()
        });
      }
      catch(error){
        errors.push([error.appKey||'copyComplex',error.appValues]);
      }
    }
    if(result.duration>LIMITS.maxExportSeconds)errors.push(['exportTooLong',{
      limit:formatTime(LIMITS.maxExportSeconds,false)
    }]);
    if(result.groups.some(group=>(group.copyBytes||0)>LIMITS.maxOutputBytes))errors.push(['estimatedTooLarge',{
      limit:formatBytes(LIMITS.maxOutputBytes)
    }]);
    if(retained+result.bytes>LIMITS.maxResultBytes)errors.push(['resultBudget',{
      limit:formatBytes(LIMITS.maxResultBytes)
    }]);
    if(result.adjustments.length)warnings.push(['copyAdjustedCuts']);
    if(clips.some(clip=>clip.hdr))warnings.push(['copyHdrNote']);
    if(clips.some(clip=>clip.previewUnavailable))warnings.push(['previewUnavailable']);
    return{
      ...result,clips,volume,retained,errors,warnings,original:true,rotation:requestedRotation()
    };
  }
  function buildPlan(){
    if(isOriginalMode())return buildCopyPlan();
    if(isCompressionMode())return {...buildCompressionPlan(),rotation:requestedRotation()};
    const plan=buildReencodePlan();
    plan.original=false;
    plan.rotation=requestedRotation();
    if(plan.clips.some(clip=>clip.hdr))plan.errors.push(['hdrUnsupported']);
    if(plan.clips.some(clip=>clip.previewUnavailable))plan.errors.push(['copyPreviewNeeded']);
    const first=plan.clips[0];
    if(first&&plan.format&&sourceExtension(first)!==plan.format.extension)plan.warnings.push(['conversionFormatChange',
    {
      from:sourceExtension(first).toUpperCase(),to:plan.format.extension.toUpperCase()
    }]);
    return plan;
  }
  /* El plan muestra los tiempos efectivos antes de escribir. El texto del botón
   indica un ajuste cuando se eligen fotogramas clave distintos de lo pedido. */
  function renderPlan(){
    const plan=buildPlan();
    ui.planFiles.textContent=plan.groups.length?String(plan.groups.length):'—';
    ui.planDuration.textContent=plan.duration?formatTime(plan.duration,false):'—';
    ui.planSize.textContent=plan.duration&&plan.bytes?'≈ '+formatBytes(plan.bytes):'—';
    ui.planDetail.textContent=plan.size?(plan.original?plan.size.width+' × '+plan.size.height+' · '+t('originalVideoData'):plan.size.width+' × '+plan.size.height+' · '+plan.fps+' fps · '+plan.bitrate+' Mbps · '+(plan.volume===0?t('noAudio'):t('audioOn'))):'';
    ui.processingNote.textContent=t(isSimpleJoin()?'joinOnlyNote':plan.original?'copyModeNote':plan.compression?'compressionModeNote':'conversionNote');
    ui.exportButton.disabled=state.busy||state.importing||plan.errors.length>0;
    let action=plan.compression?(state.mode==='split'?'exportCompressedTwo':state.mode==='join'?'exportCompressedJoined':'exportCompressed'):(state.mode==='split'?'exportTwo':state.mode==='join'?'exportJoined':'exportVideo');
    if(plan.original&&plan.adjustments?.length)action=state.mode==='split'?'exportTwoAdjusted':state.mode==='join'?'exportJoinedAdjusted':'exportAdjusted';
    ui.exportButtonText.textContent=t(state.importing?'readingFiles':state.busy?'exporting':action);
    ui.validationBox.replaceChildren();
    for(const [key,values] of plan.errors){
      const row=makeElement('div','check-line blocking');
      row.append(makeElement('span','symbol','!'),makeElement('span','',t(key,values)));
      ui.validationBox.append(row);
    }
    for(const [key,values] of plan.warnings){
      const row=makeElement('div','check-line');
      row.append(makeElement('span','symbol','!'),makeElement('span','',t(key,values)));
      ui.validationBox.append(row);
    }
    if(!plan.errors.length&&!state.busy){
      const row=makeElement('div','check-line ready');
      row.append(makeElement('span','symbol','✓'),makeElement('span','',t(plan.original?'copyReady':plan.compression?'compressionReady':'readyToExport')));
      ui.validationBox.append(row);
    }
    if(!plan.original&&!plan.compression&&!state.formats.some(format=>format.id==='mp4')){
      const row=makeElement('div','check-line');
      row.append(makeElement('span','symbol','i'),makeElement('span','',t('mp4Unavailable')));
      ui.validationBox.append(row);
    }
    ui.copyCutSummary.replaceChildren();
    ui.copyCutSummary.hidden=!plan.original||plan.errors.length>0||!plan.groups.length;
    if(!ui.copyCutSummary.hidden){
      ui.copyCutSummary.append(makeElement('p','field-label',t('effectiveCuts')));
      plan.groups.forEach((group,index)=>group.forEach(segment=>ui.copyCutSummary.append(makeElement('p','copy-cut-row',
      t('copyCutRow',{
        file:index+1,name:segment.clip.file.name,start:formatTime(segment.start),end:formatTime(segment.end)
      })))));
    }
    if(state.mode==='rotate'){
      ui.exportButtonText.textContent=t(state.importing?'readingFiles':state.busy?'exporting':'exportRotated',{degrees:requestedRotation()});
      ui.rotationNote.textContent=t(plan.original?'rotationOriginalNote':'rotationEncodeNote');
      ui.planDetail.textContent+=(ui.planDetail.textContent?' · ':'')+requestedRotation()+'° ↻';
    }
    renderEffectiveCuts(plan);
    compressionSummary(plan);
    renderBusyControls();
    renderPreviewControls(plan);
  }
  function renderBusyControls(){
    const disabled=state.busy||state.importing,original=isOriginalMode(),compress=isCompressionMode();
    ui.processingSelect.closest('.settings-controls').hidden=isSimpleJoin();
    ui.joinSettingsToggle.disabled=disabled;
    ui.swapJoinButton.disabled=disabled;
    ui.joinOrderList.querySelectorAll('select').forEach(select=>select.disabled=disabled);
    ['processingSelect','volumeSlider','muteButton','addButton','fileInput','reductionInput','compressionCodecSelect'].forEach(id=>ui[id].disabled=disabled);
    ['formatSelect','resolutionSelect','aspectSelect','qualitySelect','bitrateInput','fpsSelect'].forEach(id=>ui[id].disabled=disabled||original||(compress&&['formatSelect',
    'aspectSelect','qualitySelect','bitrateInput'].includes(id)));
    document.querySelectorAll('.encode-only').forEach(element=>element.hidden=original);
    document.querySelectorAll('.conversion-only').forEach(element=>element.hidden=original||compress);
    document.querySelectorAll('.compression-only').forEach(element=>element.hidden=!compress);
    ui.resolutionSelect.querySelector('option[value="source"]').hidden=!compress;
    ui.fpsSelect.closest('.dual-fields').classList.toggle('compression-layout',compress);
    ui.clearOutputsButton.disabled=disabled||!state.outputs.length;
    document.body.classList.toggle('busy',state.busy);
  }
  /* La lectura de tablas puede funcionar aunque el navegador no decodifique HEVC.
   En tal caso la edición original sigue disponible, pero la previsualización y
   la recodificación se bloquean. No se presenta una imagen que no se comprobó. */
  function copyThumbnail(){
    return 'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="128" height="72" viewBox="0 0 128 72"><rect width="128" height="72" fill="#272c33"/><rect x="43" y="20" width="42" height="32" rx="6" fill="none" stroke="#9ca6b2" stroke-width="2"/><path d="m60 28 12 8-12 8z" fill="#9ca6b2"/></svg>');
  }
  async function importFiles(fileList){
    if(state.busy||state.importing)return;
    const files=Array.from(fileList);
    if(!files.length)return;
    state.importing=true;
    renderAll();
    let added=0;
    try{
      for(const file of files){
        if(state.clips.length>=LIMITS.maxFiles){
          notify('tooManyFiles',{
            limit:LIMITS.maxFiles
          },'warning');
          break;
        }
        if(!file.size){
          notify('fileRejected',{
            name:file.name,reasonKey:'emptyFile'
          },'error');
          continue;
        }
        if(file.size>LIMITS.maxFileBytes){
          notify('fileRejected',{
            name:file.name,reasonKey:'fileTooLarge',reasonValues:{
              limit:formatBytes(LIMITS.maxFileBytes)
            }
          },'error');
          continue;
        }
        if(state.clips.reduce((sum,clip)=>sum+clip.file.size,0)+file.size>LIMITS.maxInputBytes){
          notify('fileRejected',{
            name:file.name,reasonKey:'inputBudget',reasonValues:{
              limit:formatBytes(LIMITS.maxInputBytes)
            }
          },'error');
          continue;
        }
        let url=null;
        try{
          const color=await inspectColor(file),copyInfo=await OriginalCopy.inspect(file);
          if(color.hdr&&!copyInfo?.supported)throw appError('hdrUnsupported');
          const indexed=state.clips.reduce((sum,clip)=>sum+(clip.copyInfo?.indexedSamples||0),0)+(copyInfo?.indexedSamples||0);
          if(indexed>LIMITS.maxIndexedSamples)throw appError('copyIndexLimit');
          url=URL.createObjectURL(file);
          let metadata,previewUnavailable=false;
          try{
            metadata=await probeVideo(file,url);
          }
          catch(error){
            if(!copyInfo?.supported)throw error;
            metadata={
              duration:copyInfo.duration,width:copyInfo.width,height:copyInfo.height,thumbnail:copyThumbnail()
            };
            previewUnavailable=true;
          }
          if(copyInfo?.supported){
            metadata.duration=copyInfo.duration;
            if(metadata.duration>LIMITS.maxSourceSeconds)throw appError('sourceTooLong',{
              limit:formatTime(LIMITS.maxSourceSeconds,false)
            });
            if(copyInfo.width*copyInfo.height>LIMITS.maxPixels||Math.max(copyInfo.width,copyInfo.height)>LIMITS.maxSide)throw appError('resolutionTooHigh');
          }
          const compressionInfo=await inspectCompression(file,copyInfo);
          const clip={
            compressionInfo,id:globalThis.crypto?.randomUUID?.()||String(Date.now()+Math.random()),file,url,...metadata,
            copyInfo,hdr:color.hdr,previewUnavailable,start:0,end:metadata.duration,split:metadata.duration/2,rotation:90,timelineZoom:1,timelineStart:0
          };
          state.clips.push(clip);
          added++;
          if(!state.activeId)state.activeId=clip.id;
          url=null;
        }
        catch(error){
          notify('fileRejected',{
            name:file.name,reasonKey:error.appKey||'decodeError',reasonValues:error.appValues
          },'error');
        }
        finally{
          if(url)URL.revokeObjectURL(url);
        }
        renderClips();
      }
      if(added){
        await selectClip(state.activeId);
        notify('importSuccess',{
          count:added
        },'success');
      }
    }
    finally{
      state.importing=false;
      ui.fileInput.value='';
      renderFormats();
      renderAll();
    }
  }
  async function selectClip(id){
    if(state.busy)return;
    stopRangePreview({clear:true});
    ui.previewVideo.pause();
    state.activeId=id;
    renderFormats();
    renderClips();
    renderEditor();
    const clip=activeClip();
    if(!clip||clip.previewUnavailable){
      ui.previewVideo.removeAttribute('src');
      ui.previewVideo.load();
      renderPlan();
      return;
    }
    try{
      await setVideoSource(ui.previewVideo,clip.url);
      if(activeClip()?.id!==id)return;
      await seekVideo(ui.previewVideo,state.mode==='join'||state.mode==='rotate'?0:clip.start);
      ui.previewVideo.volume=isSimpleJoin()?1:Number(ui.volumeSlider.value)/100;
    }
    catch(error){
      notify(error.appKey||'decodeError',error.appValues,'error');
    }
    renderPlan();
  }
  /* Exportación de copia independiente del motor anterior. Cada lote se confirma
   completo; los errores no convierten el archivo ni dejan partes incompletas. */
  async function exportOriginalVideos(){
    if(state.busy||state.importing||!commitEditorInputs())return;
    const plan=buildPlan();
    if(plan.errors.length){
      notify(plan.errors[0][0],plan.errors[0][1],'error');
      return;
    }
    stopRangePreview({clear:true});
    ui.previewVideo.pause();
    state.busy=true;
    state.activeEngine='copy';
    state.abortController=new AbortController();
    const signal=state.abortController.signal;
    state.progress={
      done:0,total:plan.duration,started:performance.now(),group:1,groups:plan.groups.length
    };
    ui.progressPanel.hidden=false;
    ui.progressNotice.textContent=t('copyProgressNote');
    renderAll();
    const pending=[];
    try{
      let done=0,bytes=0;
      for(let i=0;
      i<plan.groups.length;
      i++){
        state.progress.group=i+1;
        const group=plan.groups[i],duration=group.copyDuration;
        const result=await OriginalCopy.write(group,signal,fraction=>{
          state.progress.done=done+fraction*duration;
