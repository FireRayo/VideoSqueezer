      clip.end=Math.min(end,clip.duration);
      clip.split=clamp(clip.split,start+LIMITS.minSegment,end-LIMITS.minSegment);
      ui.rangeDuration.textContent=t('selectedDuration',{
        duration:formatTime(end-start)
      });
      renderTimeline();
      ui.splitInput.value=formatTime(clip.split);
      ui.splitSlider.min=start+LIMITS.minSegment;
      ui.splitSlider.max=Math.max(start+LIMITS.minSegment,end-LIMITS.minSegment);
      ui.splitSlider.value=clip.split;
      renderPlan();
    }
    else{
      ui.exportButton.disabled=true;
      ui.validationBox.replaceChildren(makeElement('div','check-line blocking',t('invalidRange',{
        min:LIMITS.minSegment,duration:formatTime(clip.duration)
      })));
    }
  }
  ui.startInput.addEventListener('input',trackTimeDraft);
  ui.endInput.addEventListener('input',trackTimeDraft);
  ui.splitInput.addEventListener('input',()=>{
    const clip=activeClip();
    if(!clip)return;
    const split=parseTime(ui.splitInput.value);
    const valid=Number.isFinite(split)&&split-clip.start>=LIMITS.minSegment&&clip.end-split>=LIMITS.minSegment;
    ui.splitInput.setAttribute('aria-invalid',String(!valid));
    if(valid){
      clip.split=split;
      ui.splitSlider.value=split;
      renderTimeline();
      renderPlan();
    }
    else ui.exportButton.disabled=true;
  });
  ui.startInput.addEventListener('change',()=>setRangeValue('start',parseTime(ui.startInput.value)));
  ui.endInput.addEventListener('change',()=>setRangeValue('end',parseTime(ui.endInput.value)));
  ui.splitInput.addEventListener('change',()=>setSplitValue(parseTime(ui.splitInput.value)));
  ui.splitSlider.addEventListener('input',()=>setSplitValue(Number(ui.splitSlider.value)));
  ui.markStartButton.addEventListener('click',()=>setRangeValue('start',ui.previewVideo.currentTime));
  ui.markEndButton.addEventListener('click',()=>setRangeValue('end',ui.previewVideo.currentTime));
  ui.markSplitButton.addEventListener('click',()=>setSplitValue(ui.previewVideo.currentTime));
  ui.resetRangeButton.addEventListener('click',()=>{
    const clip=activeClip();
    if(!clip)return;
    clip.start=0;
    clip.end=clip.duration;
    clip.split=clip.duration/2;
    renderEditor();
    renderPlan();
  });
  ui.seekSlider.addEventListener('input',()=>{
    if(!state.busy&&activeClip()){
      stopRangePreview({clear:true});
      ui.previewVideo.currentTime=Number(ui.seekSlider.value);
      updatePlayhead();
    }
  });
  ui.previewVideo.addEventListener('timeupdate',()=>{
    if(!state.busy){updatePlayhead();checkPreviewBoundary();}
  });
  ui.previewVideo.addEventListener('pause',()=>{
    if(!state.busy&&state.previewRange&&!previewControl.starting)stopRangePreview({pause:false,
      complete:ui.previewVideo.currentTime>=(previewControl.session?.end??Infinity)-.001});
  });
  ui.previewVideo.addEventListener('ended',()=>{
    if(!state.busy&&state.previewRange)stopRangePreview({complete:true,pause:false});
  });
  ui.previewVideo.addEventListener('play',()=>{
    if(!state.busy&&!state.previewRange&&!previewControl.starting){previewControl.session=null;paintPreviewState();}
  });
  ui.previewVideo.addEventListener('ratechange',()=>{
    if(!state.busy&&state.previewRange&&!ui.previewVideo.paused)watchPreviewBoundary();
  });
  ui.previewButton.addEventListener('click',()=>startRangePreview('selection'));
  ui.previewExportButton.addEventListener('click',()=>startRangePreview('export'));
  ui.resolutionSelect.addEventListener('change',updateQuality);
  ui.qualitySelect.addEventListener('change',updateQuality);
  ['formatSelect','aspectSelect','fpsSelect'].forEach(id=>ui[id].addEventListener('change',renderPlan));
  ui.bitrateInput.addEventListener('input',()=>{
    ui.qualitySelect.value='custom';
    renderPlan();
  });
  ui.volumeSlider.addEventListener('input',changeVolume);
  ui.muteButton.addEventListener('click',()=>{
    const value=Number(ui.volumeSlider.value);
    if(value){
      state.previousVolume=value;
      ui.volumeSlider.value=0;
    }
    else ui.volumeSlider.value=state.previousVolume||100;
    changeVolume();
  });
  ui.exportButton.addEventListener('click',exportVideos);
  ui.cancelButton.addEventListener('click',()=>state.abortController?.abort(appError('cancelled')));
  ui.clearOutputsButton.addEventListener('click',()=>{
    if(state.busy)return;
    state.outputs.forEach(result=>URL.revokeObjectURL(result.url));
    state.outputs=[];
    renderOutputs();
    renderPlan();
  });
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden&&state.previewRange&&!state.busy)stopRangePreview();
    if(document.hidden&&state.busy&&state.activeEngine!=='copy')state.abortController?.abort(appError('tabHidden'));
  });
  window.addEventListener('beforeunload',event=>{
    if(state.busy){
      event.preventDefault();
      event.returnValue='';
    }
  });
  window.addEventListener('pagehide',()=>{
    stopRangePreview({clear:true});
    state.abortController?.abort(appError('cancelled'));
  });
  /* Inicialización con respaldos. No se detecta idioma del sistema porque el contrato
   establece inglés como predeterminado; solo una preferencia válida lo sustituye. */
  state.language=readPreference('language','en');
  if(!I18N[state.language])state.language='en';
  state.theme=readPreference('theme','light');
  if(!['light','dark'].includes(state.theme))state.theme='light';
  applyTheme();
  applyLanguage();
})();
</script>
</body>
</html>
